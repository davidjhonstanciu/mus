<script>
(function () {
'use strict';
// ===== MOTOR DEL MUS VASCO (4 reyes) =====
// Baraja de 40 cartas. id = palo*10 + posición (0..9) -> rangos 1..7, 10, 11, 12.
// A 4 reyes el 3 y el 2 conservan su valor (no son reyes ni ases).
const RANKS = [1, 2, 3, 4, 5, 6, 7, 10, 11, 12];
const SUITS = ['oros', 'copas', 'espadas', 'bastos'];
const RN = { 1: 'As', 2: 'Dos', 3: 'Tres', 4: 'Cuatro', 5: 'Cinco', 6: 'Seis', 7: 'Siete', 10: 'Sota', 11: 'Caballo', 12: 'Rey' };
const RN_PL = { 1: 'ases', 2: 'doses', 3: 'treses', 4: 'cuatros', 5: 'cincos', 6: 'seises', 7: 'sietes', 10: 'sotas', 11: 'caballos', 12: 'reyes' };
const LN = ['Grande', 'Chica', 'Pares', 'Juego'];
const rankOf = id => RANKS[id % 10];
const suitOf = id => (id / 10) | 0;
const valOf = id => Math.min(rankOf(id), 10);
const STR = { 1: 0, 2: 1, 3: 2, 4: 3, 5: 4, 6: 5, 7: 6, 10: 7, 11: 8, 12: 9 };
const strOf = id => STR[rankOf(id)];
const JORD = [33, 34, 35, 36, 37, 40, 32, 31]; // de peor a mejor juego
const cmpArr = (a, b) => { for (let i = 0; i < Math.min(a.length, b.length); i++) if (a[i] !== b[i]) return a[i] - b[i]; return 0; };
const sum = h => h.reduce((a, c) => a + valOf(c), 0);
const hasJuego = h => sum(h) >= 31;

function paresOf(h) {
  const c = {};
  h.forEach(id => { const s = strOf(id); c[s] = (c[s] || 0) + 1; });
  const g = Object.keys(c).map(s => ({ s: +s, n: c[s] })).sort((a, b) => b.n - a.n || b.s - a.s);
  if (g[0].n === 4) return { t: 3, k: [g[0].s, g[0].s] };
  if (g[0].n === 3) return { t: 2, k: [g[0].s] };
  if (g[0].n === 2 && g[1] && g[1].n === 2) return { t: 3, k: [Math.max(g[0].s, g[1].s), Math.min(g[0].s, g[1].s)] };
  if (g[0].n === 2) return { t: 1, k: [g[0].s] };
  return null;
}

// Clave de comparación: mayor es mejor.
function lanceKey(l, punto, h) {
  if (l === 0) return h.map(strOf).sort((a, b) => b - a);
  if (l === 1) return h.map(strOf).sort((a, b) => a - b).map(x => -x);
  if (l === 2) { const p = paresOf(h); return p ? [p.t].concat(p.k) : [0]; }
  if (punto) return [sum(h)];
  return [JORD.indexOf(sum(h))];
}
// Gana el mejor; en empate gana el más cercano a la mano (orden de habla).
function bestSeat(l, punto, hands, ord) {
  let best = -1, bk = null;
  for (const s of ord) {
    const k = lanceKey(l, punto, hands[s]);
    if (bk === null || cmpArr(k, bk) > 0) { best = s; bk = k; }
  }
  return best;
}

function describe(h) {
  const p = paresOf(h);
  const names = ['', 'Pareja', 'Medias', 'Duples'];
  let pn = 'Sin pares';
  if (p) pn = names[p.t];
  const s = sum(h);
  return pn + ' · ' + (s >= 31 ? 'Juego ' + s : 'Punto ' + s);
}

// ---------- utilidades de estado ----------
const ordFrom = m => [m, (m + 1) % 4, (m + 2) % 4, (m + 3) % 4];
const nm = (S, s) => (S.seats[s] && S.seats[s].n) || ('Jugador ' + (s + 1));
const tn = (S, t) => nm(S, t) + ' y ' + nm(S, t + 2);
function log(S, t) { S.log.push(t); while (S.log.length > 8) S.log.shift(); }
function shuffleArr(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function pub(S) { const o = {}; for (const k in S) if (k[0] !== '_') o[k] = S[k]; return o; }

function newState(code, cfg) {
  return {
    code, v: 0, phase: 'lobby', seats: [null, null, null, null],

async function joinRoom() {
  const code = codeIn.trim().toUpperCase().replace(/[^A-Z0-9]/g, '');
  if (code.length < 4) { toast('Escribe el código de la sala.'); return; }
  if (!lobbyRoom) { toast('Las salas online no están disponibles en esta vista.'); return; }
  busy('Buscando sala…'); saveName(); fullFlag = false;
  try {
    const r = await lobbyRoom.join('mus-' + code.toLowerCase());
    attach(r); roomCode = code; hostPeer = null; isHost = false; S = null;
    for (let i = 0; i < 5 && !S && !fullFlag; i++) { helloT = 0; helloSoon(); await sleep(1500); }
    busy('');
    if (fullFlag) return;
    if (!S) { await leaveRoom('No encuentro ninguna sala con el código ' + code + '.'); return; }
    startBeat();
  } catch (e) { busy(''); await leaveRoom('No se pudo entrar en la sala.'); }
}
async function resumeHost() {
  const d = savedHost(); if (!d || !lobbyRoom) return;
  busy('Retomando sala…');
  try {
    const r = await lobbyRoom.join('mus-' + d.code.toLowerCase());
    attach(r); roomCode = d.code; S = d.S;
    S.seats.forEach(s => { if (s && s.p !== 'bot' && !s.h) s.p = null; });
    isHost = true; hostPeer = null; view = S.phase === 'lobby' ? 'lobby' : 'table'; startBeat(); busy(''); afterChange();
  } catch (e) { busy(''); toast('No se pudo retomar la sala.'); }
}
function startSolo() {
  saveName(); nr = null; myPeer = 'local'; isHost = true; roomCode = 'SOLO';
  S = newState('SOLO'); S.seats = [{ n: cleanName(), p: 'local', h: true }, null, null, null];
  const names = BOTN.slice().sort(() => Math.random() - .5);
  for (let i = 1; i < 4; i++) S.seats[i] = { n: names[i] + ' (bot)', p: 'bot' };
  newGame(S); view = 'table'; startBeat(); afterChange();
}
async function leaveRoom(msg) {
  clearInterval(hb); clearTimeout(botT); botT = 0;
  const r = nr; nr = null;
  if (r) { try { await r.leave(); } catch (e) {} }
  if (isHost) clearHost();
  S = null; isHost = false; hostPeer = null; roomCode = ''; selDisc = new Set(); swapSel = -1; senaShow = [];
  view = 'home'; busy('');
  if (msg) toast(msg); render();
}
function busy(m) { busyMsg = m; render(); }

function send(a) {
  if (!S) return;
  if (isHost) { if (act(S, mySeat(), a)) afterChange(); }
  else emit({ t: 'a', a });
}

const isOnline = s => { const st = S.seats[s]; if (!st) return false; if (st.p === 'bot' || st.p === 'local' || st.h) return true; return !!st.p && peerSet().has(st.p); };

}

function slot(i) {
  const st = S.seats[i], mine = i === mySeat();
  let who, ctl = '';
  if (!st) who = '<div class="who">Asiento libre<small>Esperando jugador</small></div>';
  else who = '<div class="who"><i class="dot ' + (isOnline(i) ? 'on' : 'off') + '"></i>' + esc(st.n) + '<small>' + (st.h ? 'Anfitrión' : st.p === 'bot' ? 'Bot' : mine ? 'Tú' : isOnline(i) ? 'Jugador' : 'Desconectado') + '</small></div>';
  if (isHost) {
    if (!st) ctl += '<button class="btn ghost sm" data-a="addbot" data-s="' + i + '">Añadir bot</button>';
    else if (st.p === 'bot') ctl += '<button class="btn ghost sm" data-a="rmbot" data-s="' + i + '">Quitar</button>';
    if (swapSel < 0) { if (st) ctl += '<button class="btn ghost sm" data-a="swap" data-s="' + i + '">Mover</button>'; }
    else ctl += '<button class="btn ' + (swapSel === i ? 'gold' : 'ghost') + ' sm" data-a="swap" data-s="' + i + '">' + (swapSel === i ? 'Cancelar' : 'Aquí') + '</button>';
  }
  return '<div class="slot ' + (st ? '' : 'empty ') + (swapSel === i ? 'sel' : '') + '">' + who + '<div class="ctl">' + ctl + '</div></div>';
}

    ? '<div class="grid2"><label class="f">Piedras por juego<select id="cfgTarget"><option value="30"' + (S.cfg.target === 30 ? ' selected' : '') + '>30 (6 amarracos)</option><option value="40"' + (S.cfg.target === 40 ? ' selected' : '') + '>40 (8 amarracos)</option></select></label>' +

    ? '<div class="btns"><button class="btn" data-a="start"' + (full ? '' : ' disabled') + '>Empezar partida</button><button class="btn ghost" data-a="shuffle">Mezclar asientos</button></div>' + (full ? '' : '<p class="note">Faltan jugadores: invita a tus compañeros o añade bots.</p>')

    (roomCode === 'SOLO' ? '' : '<p class="note">Los demás jugadores abren esta página, pulsan «Unirse con código» y escriben ' + esc(S.code) + '.</p><button class="btn ghost sm" data-a="copy">Copiar código</button>') + '</section>' +
    '<section class="panel col"><h2>Parejas</h2><div class="pairs"><div class="pair t0"><h3>Pareja 1 · frente a frente</h3>' + slot(0) + slot(2) + '</div><div class="pair t1"><h3>Pareja 2 · frente a frente</h3>' + slot(1) + slot(3) + '</div></div>' +

function seatBlock(s, rel) {
  const st = S.seats[s], me = mySeat(), h = S.hands[s] || [];
  const turn = S.turn === s || (S.phase === 'discard' && !S.disc[s]);
  const show = s === me || S.reveal;
  let cards = '';
  if (s === me && S.phase === 'discard' && !S.disc[s]) cards = h.map((c, i) => '<button class="cardbtn ' + (selDisc.has(i) ? 'sel' : '') + '" data-a="tog" data-i="' + i + '" aria-pressed="' + selDisc.has(i) + '">' + cardFace(c) + '</button>').join('');
  else cards = h.map(c => show ? cardFace(c) : cardBack()).join('');
  const tags = [S.mano === s ? 'mano' : '', S.dealer === s ? 'postre' : ''].filter(Boolean).join(' · ');
  const sn = senaShow.filter(x => x.f === s).map(x => '<div class="bubble">Seña: ' + esc(SENAS[x.k].t) + '</div>').join('');
  let tobot = '';
  if (isHost && st && st.p !== 'bot' && !st.h && !isOnline(s)) tobot = '<button class="btn gold sm" data-a="tobot" data-s="' + s + '">Pasar a bot</button>';
  return '<div class="seat p' + rel + ' team' + (s % 2) + (turn ? ' turn' : '') + '">' + sn +
    '<div class="nm"><span><i class="dot ' + (isOnline(s) ? 'on' : 'off') + '"></i>' + esc(st ? st.n : '—') + '</span>' + (tags ? '<em>' + tags + '</em>' : '') + '</div><div class="tm"></div>' +
    '<div class="hand ' + (show && s !== me ? 'rv' : '') + '">' + cards + '</div>' + tobot + '</div>';
}
function chips() {
  return [0, 1, 2, 3].map(l => {
    const r = S.lr[l], cur = S.phase === 'play' && S.lance === l;
    let st = '';
    if (cur) st = 'ahora'; else if (r) st = { pass: 'paso', acc: 'envite ' + (r.st || ''), fold: 'no quiero', uno: 'sin envite', none: 'nadie', og: 'órdago' }[r.k] || '';
    return '<div class="chip ' + (cur ? 'cur' : '') + '"><b>' + (l === 3 && S.punto ? 'Punto' : LN[l]) + '</b><small>' + st + '</small></div>';
  }).join('');
}
const E_ = s => esc(nm(S, s));
function statusAndActions() {
  const me = mySeat(), mine = S.turn === me;
  let title = '', sub = '', btns = '';
  if (S.phase === 'mus') {
    title = mine ? 'Te toca: ¿mus?' : 'Habla ' + E_(S.turn) + ': ¿mus?';
    sub = 'Si los cuatro decís mus, cada uno descarta de 1 a 4 cartas. Un «no hay mus» corta y se juega.';
    if (mine) btns = '<button class="btn" data-a="mus" data-y="1">Mus</button><button class="btn ghost" data-a="mus" data-y="0">No hay mus</button>';
  } else if (S.phase === 'discard') {
    const left = S.disc.filter(x => !x).length;
    if (!S.disc[me]) {
      title = 'Elige las cartas que descartas'; sub = 'Toca las cartas de tu mano y confirma. Faltan por decidir: ' + left + '.';
      btns = '<button class="btn" data-a="disc"' + (selDisc.size ? '' : ' disabled') + '>Descartar ' + selDisc.size + (selDisc.size === 1 ? ' carta' : ' cartas') + '</button>';
    } else { title = 'Descarte hecho'; sub = 'Esperando a los demás jugadores (' + left + ').'; }
  } else if (S.phase === 'play' && S.b) {
    const b = S.b, ln = S.lance === 3 && S.punto ? 'Punto' : LN[S.lance];
    if (b.mode === 'open') {
      title = mine ? 'Tu turno en ' + ln : 'Turno de ' + E_(S.turn) + ' en ' + ln;
      sub = 'Paso, envido o órdago. ' + (S.lance >= 2 && !S.punto ? 'Juegan solo quienes tienen ' + ln.toLowerCase() + '.' : '');
      if (mine) btns = '<button class="btn ghost" data-a="bet" data-k="paso">Paso</button><span class="grp"><span class="stp"><button data-a="step" data-d="-1" aria-label="Menos">−</button><b>' + stepN + '</b><button data-a="step" data-d="1" aria-label="Más">+</button></span><button class="btn" data-a="bet" data-k="env">Envido ' + stepN + '</button></span><button class="btn gold" data-a="bet" data-k="og">¡Órdago!</button>';
    } else {
      const who = nm(S, b.last);
      title = b.og ? '¡Órdago de ' + esc(who) + '!' : esc(who) + ' envida ' + b.stake;
      sub = mine ? 'Responde por tu pareja: tu respuesta la compromete.' : 'Responde ' + E_(S.turn) + '.';
      if (mine) btns = '<button class="btn" data-a="bet" data-k="q">' + (b.og ? 'Quiero (todo el juego)' : 'Quiero') + '</button><button class="btn ghost" data-a="bet" data-k="nq">No quiero</button>' +
        (b.og ? '' : '<span class="grp"><span class="stp"><button data-a="step" data-d="-1" aria-label="Menos">−</button><b>' + stepN + '</b><button data-a="step" data-d="1" aria-label="Más">+</button></span><button class="btn" data-a="bet" data-k="env">Subir a ' + Math.min(b.stake + stepN, S.cfg.target) + '</button></span><button class="btn gold" data-a="bet" data-k="og">¡Órdago!</button>');
    }
  } else if (S.phase === 'recuento' || S.phase === 'over') {
    const over = S.phase === 'over';
    title = over ? '¡Fin de la partida!' : 'Recuento de la mano ' + S.hn;
    sub = over && S.fin ? 'Ganan ' + esc(tn(S, S.fin.team)) + '.' : 'Se enseñan las cartas y se cuentan las piedras.';
    btns = over ? (isHost ? '<button class="btn" data-a="again">Nueva partida</button>' : '<span class="note">El anfitrión puede empezar otra partida.</span>') : '<button class="btn" data-a="next">Siguiente mano</button>';
  }
  const res = (S.phase === 'recuento' || S.phase === 'over') && S.res.length ? '<ul class="res">' + S.res.map(x => '<li>' + esc(x) + '</li>').join('') + '</ul>' : '';
  let senas = '';
  if (['mus', 'discard', 'play'].includes(S.phase)) {
    senas = '<div class="col"><button class="btn ghost sm" data-a="senas" style="align-self:flex-start">' + (showSenas ? 'Ocultar señas' : 'Señas a mi compañero') + '</button>' +
      (showSenas ? '<div class="senas">' + Object.keys(SENAS).map(k => '<button class="btn ghost sm" data-a="sena" data-k="' + k + '">' + esc(SENAS[k].t) + '</button>').join('') + '</div><p class="note">Solo ve la seña tu compañero y solo puedes enviar señas verdaderas.</p>' : '') + '</div>';
  }
  return '<section class="panel bar"><h2>' + title + '</h2><p class="sub">' + sub + '</p>' + (btns ? '<div class="btns">' + btns + '</div>' : '') + res + senas + '</section>';
}
function teamCard(t) {
  const p = S.sc[t], groups = S.cfg.target / 5, need = (S.cfg.juegos + 1) / 2;
  let ams = '';
  for (let g = 0; g < groups; g++) { let d = ''; for (let k = 0; k < 5; k++) d += '<i class="' + (g * 5 + k < p ? 'on' : '') + '"></i>'; ams += '<span class="am">' + d + '</span>'; }
  let vc = ''; if (S.cfg.juegos > 1) { vc = '<div class="vaca">Juegos '; for (let i = 0; i < need; i++) vc += '<i class="' + (S.jw[t] > i ? 'on' : '') + '"></i>'; vc += '</div>'; }
  return '<div class="team t' + t + '"><div class="tn">' + esc(tn(S, t)) + '</div><div class="score"><b>' + p + '</b><span>de ' + S.cfg.target + ' piedras</span></div><div class="ams" title="Cada bloque es un amarraco (5 piedras)">' + ams + '</div>' + vc + '</div>';
}
function renderTable() {
  const me = mySeat();
  if (me < 0) { helloSoon(); return '<section class="panel col"><h2>Reconectando con la mesa…</h2><p class="note">Si tarda, comprueba que el anfitrión sigue conectado.</p></section>'; }
  const rel = s => (s - me + 4) % 4;
  let seats = ''; for (let s = 0; s < 4; s++) seats += seatBlock(s, rel(s));
  const b = S.b;
  const bet = S.phase === 'play' && b && b.mode === 'resp' ? '<div class="bet">' + (b.og ? '¡Órdago!' : 'Envite: ' + b.stake) + '</div>' : '';
  const gone = !isHost && nr && hostPeer && Date.now() - joinedAt > 4000 && !peerSet().has(hostPeer);
  const myh = S.hands[me] || [];
  return (gone ? '<div class="bad">El anfitrión se ha desconectado. La partida continuará si vuelve a abrir la sala.</div>' : '') +
    '<section class="felt" aria-label="Mesa de mus">' + seats + '<div class="mid"><div class="chips">' + chips() + '</div>' + bet + '</div></section>' +
    (myh.length === 4 && S.phase !== 'recuento' && S.phase !== 'over' ? '<p class="note" style="text-align:center">Tu mano: <b>' + esc(describe(myh)) + '</b></p>' : '') +
    statusAndActions() +
    '<div class="side"><section class="panel col"><h3>Marcador</h3>' + teamCard(0) + teamCard(1) + '</section><section class="panel col"><h3>Mesa</h3><ul class="logl">' + S.log.slice().reverse().map(x => '<li>' + esc(x) + '</li>').join('') + '</ul></section></div>';
}

    '<tr><td>Pares</td><td>Por cada jugador de la pareja ganadora que tenga pares: pareja <b>1</b>, medias <b>2</b>, duples <b>3</b></td></tr>' +
    '<tr><td>Juego</td><td>Por cada jugador de la pareja ganadora con juego: <b>3</b> con 31 y <b>2</b> con cualquier otro juego</td></tr>' +
    '<tr><td>Punto</td><td><b>1</b> piedra para el mejor punto</td></tr></tbody></table></div>' +
    '<h3>Recuento</h3><ul><li>Al terminar la mano se enseñan las cartas y se cuenta en orden: grande, chica, pares y juego (o punto).</li><li>Si hubo envite aceptado, la pareja que gana el lance cobra lo apostado. En pares y juego cobra además los puntos de sus pares o de su juego.</li><li>La primera pareja que llega al objetivo gana el juego en el acto, aunque queden lances por contar.</li><li>Los «no quiero» se cobran en el momento.</li></ul>'; }],
  envites: ['Envites', function () { return '<h2>Envites y órdago</h2><ul>' +
    '<li>Al llegar su turno en un lance, cada jugador puede <b>pasar</b>, <b>envidar</b> o lanzar un <b>órdago</b>. El envite mínimo es de 2 piedras.</li>' +
    '<li>Quien recibe un envite responde <b>quiero</b>, <b>no quiero</b> o sube la apuesta. En esta mesa responde el primer rival al que le toca hablar y su respuesta compromete a su pareja.</li>' +
    '<li>Con <b>no quiero</b>, quien envidó se lleva en el acto lo apostado antes del último envite, o 1 piedra si era el primero (el «deje»). El lance se da por ganado y se sigue con el siguiente.</li>' +
    '<li>Si todos pasan en un lance sin envite, ese lance se cuenta con su valor sin apuesta.</li>' +
    '<li>El <b>órdago</b> pone en juego todo el juego. Si se acepta, se enseñan las cartas del lance y quien lo gane gana el juego en el momento. Si no se acepta, el que lo lanzó cobra 1 piedra (o lo anterior si venía de una subida) y se sigue jugando.</li></ul>'; }],
  senas: ['Señas', function () { return '<h2>Señas</h2><ul><li>En el mus vasco se permiten las señas entre compañeros, pero no se puede mentir. Una seña falsa se castiga, en el reglamento tradicional, con la pérdida del juego.</li>' +
    '<li>Señas tradicionales: morderse el labio inferior (dos reyes), guiñar un ojo (31), cerrar los ojos (ciego, sin pares ni juego) y lanzar un beso al aire (tres reyes y un as).</li></ul>' +
    '<h3>En esta mesa</h3><ul><li>Pulsa «Señas a mi compañero» y elige una. Solo la ve tu compañero.</li><li>Solo puedes enviar señas verdaderas: 31, duples, medias, pareja, ciego, dos reyes y tres reyes. Si la seña sería falsa, la mesa no la envía.</li></ul>'; }],
  glosario: ['Glosario', function () { return '<h2>Glosario</h2><dl class="kv">' +
    '<dt>Amarraco</dt><dd>Grupo de 5 piedras en el marcador.</dd><dt>Piedra</dt><dd>Un tanto.</dd>' +
    '<dt>Órdago</dt><dd>Apuesta de todo el juego. Viene del vasco «hor dago», «ahí está».</dd>' +
    '<dt>Mano</dt><dd>Jugador a la derecha del repartidor. Habla primero y gana los empates.</dd><dt>Postre</dt><dd>El repartidor. Habla último.</dd>' +
    '<dt>Envido</dt><dd>Apuesta de 2 piedras o más.</dd><dt>Deje</dt><dd>La piedra que se cobra cuando no se acepta el primer envite.</dd>' +
    '<dt>Duples</dt><dd>Dos parejas o cuatro cartas iguales.</dd><dt>Medias</dt><dd>Tres cartas iguales.</dd><dt>Ciego</dt><dd>Mano sin pares ni juego.</dd>' +
    '<dt>Vaca</dt><dd>Conjunto de juegos; se gana al ganar la mayoría.</dd><dt>Mus visto</dt><dd>Variante en la que el repartidor enseña una carta. No se juega aquí.</dd></dl>'; }]
};
function renderGuide() {
  return '<section class="panel col"><div class="tabs" role="tablist">' + Object.keys(GUIDE).map(k => '<button class="tab" role="tab" aria-selected="' + (k === guideTab) + '" data-a="gtab" data-k="' + k + '">' + GUIDE[k][0] + '</button>').join('') + '</div><div class="guide">' + GUIDE[guideTab][1]() + '</div></section>';
}

function render() {
  renderNav();
  let html = '';
  if (view === 'guide') html = renderGuide();
  else if (view === 'home' || !S) html = renderHome();
  else if (view === 'lobby') html = renderLobby();
  else html = renderTable();
  const ae = document.activeElement, keep = ae && ae.id && (ae.id === 'inName' || ae.id === 'inCode') ? ae.id : null;
  if (keep && view === 'home' && !busyMsg && roomAvail === (renderHome.last)) return;
  renderHome.last = roomAvail;
  $app.innerHTML = html;
  if (keep) { const el = document.getElementById(keep); if (el) { el.focus(); const n = el.value.length; try { el.setSelectionRange(n, n); } catch (e) {} } }
}

// ---------- eventos ----------
const H = {
  create: createRoom, join: joinRoom, solo: startSolo, resume: resumeHost,
  guide() { guideBack = view; view = 'guide'; render(); },
  guideBack() { view = guideBack || 'home'; if (!S && view !== 'home') view = 'home'; render(); },
  gtab(d) { guideTab = d.k; render(); },
  leave() { leaveRoom(); },
  copy() { try { navigator.clipboard.writeText(S.code).then(() => toast('Código copiado'), () => toast('Copia el código a mano: ' + S.code)); } catch (e) { toast('Copia el código a mano: ' + S.code); } },
  addbot(d) { if (!isHost) return; const i = +d.s; if (S.seats[i]) return; const used = S.seats.filter(Boolean).map(s => s.n); const n = BOTN.find(x => !used.includes(x + ' (bot)')) || 'Bot'; S.seats[i] = { n: n + ' (bot)', p: 'bot' }; afterChange(); },
  rmbot(d) { if (!isHost) return; const i = +d.s; if (S.seats[i] && S.seats[i].p === 'bot') { S.seats[i] = null; afterChange(); } },
  swap(d) {
    if (!isHost) return; const i = +d.s;
    if (swapSel < 0) { swapSel = i; render(); return; }
    if (swapSel !== i) { const t = S.seats[swapSel]; S.seats[swapSel] = S.seats[i]; S.seats[i] = t; }
    swapSel = -1; afterChange();
  },
  shuffle() { if (!isHost) return; S.seats = shuffleArr(S.seats); swapSel = -1; afterChange(); },
  start() { if (isHost && S.seats.every(Boolean)) { newGame(S); selDisc = new Set(); afterChange(); } },
  tobot(d) { if (!isHost) return; const i = +d.s, st = S.seats[i]; if (st && st.p !== 'bot' && !st.h) { S.seats[i] = { n: st.n + ' (bot)', p: 'bot' }; afterChange(); } },
  mus(d) { send({ a: 'mus', y: d.y === '1' }); },
  tog(d) { const i = +d.i; if (selDisc.has(i)) selDisc.delete(i); else selDisc.add(i); render(); },
  disc() { if (!selDisc.size) return; const c = Array.from(selDisc); selDisc = new Set(); send({ a: 'disc', c }); },
  step(d) { stepN = Math.max(2, Math.min(20, stepN + (+d.d))); render(); },
  bet(d) { const a = { a: 'bet', k: d.k }; if (d.k === 'env') a.n = stepN; send(a); },
  next() { send({ a: 'next' }); },
  again() { if (isHost) { send({ a: 'again' }); selDisc = new Set(); } },
  senas() { showSenas = !showSenas; render(); },
  sena(d) { if (isHost) doSena(mySeat(), d.k); else emit({ t: 'sena', s: d.k }); }
};
$app.addEventListener('click', e => { const t = e.target.closest('[data-a]'); if (!t || t.disabled) return; const f = H[t.dataset.a]; if (f) f(t.dataset); });
$nav.addEventListener('click', e => { const t = e.target.closest('[data-a]'); if (!t) return; const f = H[t.dataset.a]; if (f) f(t.dataset); });
$app.addEventListener('input', e => {
  if (e.target.id === 'inName') { myName = e.target.value; saveName(); }
  else if (e.target.id === 'inCode') { codeIn = e.target.value.toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 6); e.target.value = codeIn; }
});
$app.addEventListener('change', e => {
  if (!isHost || !S) return;
  if (e.target.id === 'cfgTarget') { S.cfg.target = +e.target.value === 40 ? 40 : 30; afterChange(); }
  else if (e.target.id === 'cfgJuegos') { S.cfg.juegos = +e.target.value === 1 ? 1 : 3; afterChange(); }
});
$app.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.id === 'inCode') joinRoom(); });

async function initRoom() {
  try { if (window.claude && window.claude.use) lobbyRoom = await window.claude.use('room'); } catch (e) { lobbyRoom = null; }
  roomAvail = !!lobbyRoom; if (view === 'home') render();
}
render(); initRoom();
})();
</script>

</body></html>
